
openapi: 3.0.3

info:
  title: My App API
  version: 1.0.0
  description: API documentation for user management and authentication.

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Users
    description: User management
  - name: Authentication
    description: User registration

paths:
  /api/users:
    get:
      tags:
        - Users
      summary: List users
      description: Returns a paginated list of users.
      operationId: listUsers
      parameters:
        - name: page
          in: query
          description: The page number to retrieve.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Users retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/register:
    post:
      tags:
        - Authentication
      summary: Register a user
      description: Creates a new user account.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              first_name: John
              last_name: Doe
              email: john.doe@example.com
      responses:
        '201':
          description: Registration successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationSuccess'
              example:
                code: REGISTRATION_SUCCESSFUL
        '422':
          description: Validation failed. For example, a required field is missing or the email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                invalidFields:
                  summary: Invalid or missing fields
                  value:
                    code: VALIDATION_FAILED
                    errors:
                      first_name:
                        - The first name field is required.
                      email:
                        - The email has already been taken.
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        first_name:
          type: string
          maxLength: 255
          example: John
        last_name:
          type: string
          maxLength: 255
          example: Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
      required:
        - id
        - first_name
        - last_name
        - email

    PaginatedUsers:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        first_page_url:
          type: string
          nullable: true
          example: http://localhost:8080/api/users?page=1
        from:
          type: integer
          nullable: true
          example: 1
        last_page:
          type: integer
          example: 3
        last_page_url:
          type: string
          nullable: true
          example: http://localhost:8080/api/users?page=3
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                nullable: true
              label:
                type: string
              active:
                type: boolean
        next_page_url:
          type: string
          nullable: true
        path:
          type: string
          example: http://localhost:8080/api/users
        per_page:
          type: integer
          example: 15
        prev_page_url:
          type: string
          nullable: true
        to:
          type: integer
          nullable: true
          example: 15
        total:
          type: integer
          example: 42
      required:
        - current_page
        - data
        - last_page
        - per_page
        - total

    RegisterRequest:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 255
          example: John
        last_name:
          type: string
          maxLength: 255
          example: Doe
        email:
          type: string
          format: email
          maxLength: 255
          example: john.doe@example.com
      required:
        - first_name
        - last_name
        - email

    RegistrationSuccess:
      type: object
      properties:
        code:
          type: string
          example: REGISTRATION_SUCCESSFUL
      required:
        - code

    ValidationError:
      type: object
      properties:
        code:
          type: string
          example: VALIDATION_FAILED
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
              - The email has already been taken.
      required:
        - code
        - errors

    ApiError:
      type: object
      properties:
        message:
          type: string
          example: Server error
      required:
        - message

  responses:
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
